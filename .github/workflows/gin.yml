name: Run Tests
permissions:
  contents: read
jobs:
  lint:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ^1
    - name: Setup golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11
        args: --verbose
    timeout-minutes: 12
  test:
    needs: lint
    strategy:
      matrix:
        os:
        - ubuntu-latest
        go:
        - '1.25'
        - '1.26'
        test-tags:
        - ''
        - -tags nomsgpack
        - --ldflags="-checklinkname=0" -tags sonic
        - -tags go_json
        - -race
        include:
        - os: ubuntu-latest
          go-build: ~/.cache/go-build
        - os: macos-latest
          go-build: ~/Library/Caches/go-build
      fail-fast: false
    name: ${{ matrix.os }} @ Go ${{ matrix.go }} ${{ matrix.test-tags }}
    runs-on: self-hosted
    env:
      GO111MODULE: true
      TESTTAGS: ${{ matrix.test-tags }}
      GOPROXY: https://proxy.golang.org
    steps:
    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go }}
        cache: false
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}
    - uses: actions/cache@v5
      with:
        path: |
          ${{ matrix.go-build }}
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Run Tests
      run: make test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        flags: ${{ matrix.os }},go-${{ matrix.go }},${{ matrix.test-tags }}
    timeout-minutes: 12
    if: ${{ !cancelled() }}
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
